name: Publish packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@bobrossthepainter"
      - run: npm ci
      - run: npm run check
      - run: npm publish -w @bobrossthepainter/glimpse-relay-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish -w @bobrossthepainter/glimpse-relay
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish -w @bobrossthepainter/pi-diff-view
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
